upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

date.timezone = Asia/Shanghai

display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
error_log = /var/log/php_errors.log

expose_php = On

; 开发环境调试说明：
; 本文件仅覆盖 PHP 参数，不含 xdebug 配置。
; xdebug 需要通过 pecl 编译安装才能启用，而 Dockerfile 同时用于生产镜像，
; 不能为开发调试在生产镜像里安装调试扩展；如需断点调试，请自行构建带 xdebug 的镜像
; 并用 volumes 覆盖本文件。