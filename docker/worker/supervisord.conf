[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
; think-queue 的 queue:work 默认即为常驻守护模式，且不支持 --max-time（该参数为 Laravel 专有），
; 传入会导致命令因「选项不存在」直接退出。并发数请调整 numprocs，不要扩容容器副本。
command=php /var/www/html/think queue:work --sleep=3 --tries=3
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-worker.log
stopwaitsecs=3600

[program:scheduler]
process_name=%(program_name)s
; 项目自有命令为 `crontab`（app\common\command\Crontab），不存在 schedule:run；
; 且必须前台运行：加 --daemon 会让 workerman 转入后台，supervisord 将失去进程控制权。
command=php /var/www/html/think crontab start
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
