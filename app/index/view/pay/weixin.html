{extend name="../../common/view/main"/}

{block name="style"}

{/block}

{block name="body"}

<div class="payment-section">
    <div class="pay-weixin" data-url="{:url('api/orders/detail', ['shopid' => $shopid, 'order_no' => $order_data['order_no']])}" data-order-no="{$order_data['order_no']}">
        <div class="pay-head">
            <span class="pay-brand"><i class="fa fa-weixin"></i></span>
            <div class="pay-head-text">
                <h2>微信扫码支付</h2>
                <p>请使用手机微信扫描下方二维码完成支付</p>
            </div>
        </div>

        <div class="pay-amount">
            <span class="pay-amount-label">应付金额</span>
            <div class="pay-amount-value">
                <em>￥</em><span class="paid-fee">{$order_data['paid_fee']}</span>
            </div>
        </div>

        <div class="qrcode">
            <div class="qrcode-box">
                <img src="{$code_url}" alt="微信支付二维码"/>
            </div>
            <p class="qrcode-tip"><i class="fa fa-mobile"></i>打开微信「扫一扫」扫描二维码</p>
        </div>

        <div class="pay-status">
            <i class="pay-status-dot"></i>
            <span>支付完成后页面将自动跳转，请勿关闭</span>
        </div>

        <div class="pay-order">
            <span class="pay-order-label">订单编号</span>
            <span class="order-no">{$order_data['order_no']}</span>
        </div>
    </div>
</div>
{/block}

{block name="script"}
<script>
	$(function(){
		var url = $('.pay-weixin').data('url');
		var data = {
			'order_no' : $('.pay-weixin').data('order-no'),
		};
		var qrcode_pay_expire = setInterval(function(){
            $.post(url,data,function($res){
              if($res.code == 200 && $res.data.paid == 1){
                window.clearInterval(qrcode_pay_expire);
                //支付成功业务逻辑
                toast.success('支付成功，页面即将跳转~');
                setTimeout(function(){
                  //设置二维码过期
                  location.href = $res.url;
                }, 1500);
              }
            });
          }, 1000);
	})
</script>
{/block}
